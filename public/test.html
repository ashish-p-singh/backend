<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing</title>
</head>
<body>
    <p id="hi"></p>
    <script>
        async function testPost(){
            const a= await fetch("/",{method: "POST"})
            let b= await a.text()
            document.getElementById("hi").innerHTML=b
        }
        testPost()
    </script>
</body>
</html>
