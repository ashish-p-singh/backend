<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraEdit</title>
    <link rel="icon" type="image/x-icon" href="mando.ico">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: white;
        }

        nav {
            margin: auto 45px;
            height: 40px;
            width: auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        ul {
            display: flex;
            justify-content: right;
            gap: 20px;
        }

        @media only screen and (max-width: 480px) {
            ul {
                display: none;
            }
        }

        ul li {
            list-style: none;
        }

        img {
            height: 40px;
            width: 164px;
        }

        .head {
            display: flex;
            margin: 8vh 304px;
            margin-bottom: 2vh;
            align-items: center;
        }

        @media only screen and (max-width: 480px) {
            .head {
                display: flex;
                margin: 8vh 11px;
                margin-bottom: 2vh;
                align-items: center;
            }
        }

        .container {
            display: grid;
            grid-template-columns: 250px 250px 250px;
            grid-auto-rows: 200px;
            gap: 40px;
            justify-content: center;

        }

        @media only screen and (max-width: 480px) {
            .container {
                grid-template-columns: 250px;
            }
        }

        .gbox {
            background-color: rgba(202, 202, 202, 0.629);
            text-align: center;
            padding: 25px;
            position: relative;
        }

        h3 {
            margin-bottom: 10px;
        }

        .gbox button {
            position: absolute;
            bottom: 35px;
            font-size: 13px;
            height: 40px;
            border: none;
            border-radius: 10px;
        }

        .but {
            left: 15px;
            background-color: rgb(0, 255, 255);
            color: gray;

        }

        .but2 {
            right: 15px;
            background-color: rgb(0, 255, 0);
            color: gray;

        }

        .gbox p {
            font-size: 15px;

        }
    </style>
</head>

<body>
    <header>
        <nav>
            <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg" alt="mando">
            <ul>
                <li>Products</li>
                <li>Pricing</li>
                <li>Buissness</li>
                <li>About US</li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="head">
            <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg" alt="ut">
            <p>Download UltraEdit</p>
        </div>
        <div class="container">
            <div class="gbox">
                <h3>English</h3>
                <button class="but">Download 32-bit</button>
                <button class="but2">Download 64-bit</button>
            </div>
            <div class="gbox">
                <h3>Deutsch</h3>
                <p>German</p>
                <button class="but">Download 32-bit</button>
                <button class="but2">Download 64-bit</button>
            </div>
            <div class="gbox">
                <h3>Italiano</h3>
                <p>Italian</p>
                <button class="but">Download 32-bit</button>
                <button class="but2">Download 64-bit</button>
            </div>
            <div class="gbox">
                <h3>Espanol</h3>
                <p>Spanish</p>
                <button class="but">Download 32-bit</button>
                <button class="but2">Download 64-bit</button>
            </div>
            <div class="gbox">
                <h3>Francias</h3>
                <p>France</p>
                <button class="but">Download 32-bit</button>
                <button class="but2">Download 64-bit</button>
            </div>
            <div class="gbox">
                <h3>Portugues</h3>
                <p>Portugese</p>
                <button class="but">Download 32-bit</button>
                <button class="but2">Download 64-bit</button>
            </div>
        </div>
    </main>

</body>

</html>
