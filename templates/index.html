<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glowing Bulb</title>
  <style>
    .bulb {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: gray;
      margin: 50px auto;
      transition: all 0.3s ease;
    }

    .glow {
      background-color: yellow;
      box-shadow: 0 0 30px 15px yellow;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="bulb" id="bulb"></div>
  <button onclick="toggleBulb()">Toggle Bulb</button>

  <script>
   function toggleBulb(){
    document.getElementById('bulb').classList.toggle('glow')
   }
  </script>
</body>
</html>
